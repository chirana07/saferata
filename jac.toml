[project]
name = "saferata"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main"
kind = "web-app"
jac-version = "==0.34.24"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
lucide-react = "^0.575.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
tailwindcss = "^4.2.1"
"@tailwindcss/vite" = "^4.2.1"
tw-animate-css = "^1.3.4"



[dev-dependencies]
[client]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[byllm.model]
default_model = "ollama_chat/gpt-oss:120b-cloud"

[dependencies.pypi.dev]
watchdog = ">=3.0.0"
